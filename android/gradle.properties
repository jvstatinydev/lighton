org.gradle.jvmargs=-Xmx6144m
android.useAndroidX=true
android.enableJetifier=true
# Kotlin/Java jvm target 불일치는 오류 대신 경고로 (플러그인 모듈 대응)
kotlin.jvm.target.validation.mode=warning
# 최적화된 리소스 축소: 리소스와 DEX 를 한 번의 R8 패스에서 같이 분석해,
# 서로를 넘나드는 참조까지 보고 안 쓰는 리소스와 그 리소스를 읽던 코드를 함께
# 지운다. AGP 8.12~8.13 은 이 플래그로 켜고 AGP 9 부터는 기본값이다.
# 켜지 않으면 Play Console 이 "최적화된 리소스 축소가 사용 설정되지 않음"
# 이라고 경고한다. (shrinkResources 가 켜져 있어야 의미가 있다.)
android.r8.optimizedResourceShrinking=true
