name: Build Android APK

# Builds an installable release APK in the cloud so the app can be updated
# without a local machine. The release build is signed with the debug key
# (see android/app/build.gradle), so the resulting APK installs directly on a
# phone. For a Play Store upload you will later need a real signing key.

on:
  push:
    branches:
      # main is built on every push so the *merged* result is verified. Feature
      # branches are only ever built against the base they branched from, so a
      # set of individually-green PRs can still combine into a broken main.
      - main
      - flutterflow
      - "claude/**"
  workflow_dispatch: {} # lets you trigger a build manually from the GitHub website

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8" # Dart 3.12; required for compileSdk 36 / AGP 8.9.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 에이전트 환경에는 Flutter 툴체인이 없어 pubspec.lock 을 재생성할 수 없다.
      # 의존성을 바꾼 뒤에는 러너가 해석한 락을 여기서 받아 커밋해야, CI 가 같은
      # 버전을 쓰도록 락을 커밋하는 의미가 유지된다.
      - name: Upload resolved pubspec.lock
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock

      # 코드에 컴파일 오류가 있으면 빌드 전에 빠르게 잡아낸다.
      # 기존 경고(FlutterFlow 생성 코드)는 빌드를 막지 않도록 제외.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # 플래시 카메라 선택 정책은 문제 기기가 없어도 검증할 수 있어야 한다.
      # 이 단계가 없으면 test/ 에 테스트를 넣어도 아무도 돌리지 않는다.
      #
      # `flutter test` 로 전체를 돌리지 않는 이유: test/widget_test.dart 는
      # FlutterFlow 기본 스모크 테스트인데 SharedPreferences 를 초기화하지 않고
      # MyApp() 을 띄운다. FFLocalizations._prefs 가 `static late` 라
      # getStoredLocale() 에서 LateInitializationError 가 난다. 지금까지 CI가
      # 테스트를 돌린 적이 없어 드러나지 않았을 뿐이다. 그 파일을 고치는 것은
      # 별도 작업이므로, 여기서는 검증할 수 있는 것만 돌린다.
      - name: Test
        run: |
          flutter test \
            test/torch_util_test.dart \
            test/screen_light_test.dart \
            test/edge_to_edge_test.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: light-on-flashlight-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
