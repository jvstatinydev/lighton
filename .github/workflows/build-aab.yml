name: Build Play Store AAB

# Play Console에 올리는 배포용 파일(.aab)을 만든다.
# APK 워크플로(build-apk.yml)는 폰에 바로 설치해보는 용도(디버그 키 서명)이고,
# 이 워크플로는 실제 스토어 업로드용(업로드 키 서명)이다.
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   업로드 키(.jks) 파일을 base64 텍스트로 변환한 값
#   ANDROID_KEYSTORE_PASSWORD 키스토어 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭 (upload)
#   ANDROID_KEY_PASSWORD      키 비밀번호
#   PLAY_SERVICE_ACCOUNT_JSON Play에 자동 업로드할 때만 필요. 서비스 계정 JSON 키 파일의
#                             전체 내용을 그대로 붙여넣는다 (track 입력이 none이면 안 써도 됨).
# 시크릿은 로그에 마스킹되며, 키 파일은 빌드가 끝나면 삭제된다.

on:
  # 배포용 빌드는 아무 때나 도는 것이 아니라, 올릴 준비가 됐을 때만 수동으로 돌린다.
  # GitHub → Actions → "Build Play Store AAB" → Run workflow.
  # 터미널에서는:
  #   gh workflow run build-aab.yml -f track=internal
  workflow_dispatch:
    inputs:
      build_name:
        description: "버전 이름 (비우면 pubspec.yaml 값 사용). 예: 1.0.2"
        required: false
        default: ""
      build_number:
        description: "버전 코드 — Play에 이미 올라간 것보다 반드시 커야 함 (비우면 pubspec.yaml 값 사용). 예: 10"
        required: false
        default: ""
      # 기본값이 none인 것은 의도적이다. 평소 빌드는 지금까지처럼 아티팩트만 만들고,
      # Play로 나가는 것은 매번 명시적으로 track을 골랐을 때뿐이다.
      track:
        description: "업로드할 Play 트랙 (none이면 업로드하지 않고 아티팩트만 만든다)"
        required: false
        type: choice
        default: none
        options: [none, internal, alpha, beta, production]
      release_status:
        description: "completed=바로 출시, draft=Play Console에 초안으로만 올려두고 출시는 수동으로"
        required: false
        type: choice
        default: completed
        options: [completed, draft]
      release_notes:
        description: "출시 노트 (비우면 노트 없이 업로드)"
        required: false
        default: ""
      release_notes_locale:
        description: "출시 노트 언어. 스토어 등록정보에 실제로 있는 언어여야 한다. 예: ko-KR, en-US"
        required: false
        default: "ko-KR"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 업로드까지 하기로 해놓고 서비스 계정 시크릿이 없으면, 10분 걸리는 빌드를
      # 다 끝낸 뒤 마지막 단계에서 실패하게 된다. 그러기 전에 여기서 멈춘다.
      - name: Check Play upload secret
        if: inputs.track != 'none'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::track=${{ inputs.track }} 로 업로드하려면 PLAY_SERVICE_ACCOUNT_JSON 시크릿이 필요합니다."
            echo "::error::Play Console → 설정 → API 액세스 에서 만든 서비스 계정 JSON 키의 내용을"
            echo "::error::GitHub → Settings → Secrets and variables → Actions 에 그대로 등록해 주세요."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8" # Dart 3.12; required for compileSdk 36 / AGP 8.9.1
          cache: true

      # 시크릿이 하나라도 비어 있으면, 조용히 디버그 키로 서명된 쓸모없는 AAB가
      # 나오는 대신 여기서 명확한 메시지와 함께 멈춘다.
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::업로드 키 시크릿이 없습니다:$missing"
            echo "::error::GitHub → Settings → Secrets and variables → Actions 에서 등록해 주세요."
            exit 1
          fi

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          # key.properties는 android/ 폴더 기준으로 읽힌다 (android/app/build.gradle 참고).
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release AAB
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          args=""
          if [ -n "$BUILD_NAME" ]; then
            args="$args --build-name=$BUILD_NAME"
          fi
          if [ -n "$BUILD_NUMBER" ]; then
            args="$args --build-number=$BUILD_NUMBER"
          fi
          flutter build appbundle --release $args

      # Play Console에 등록된 업로드 키 지문과 같은지 눈으로 확인할 수 있게 찍어둔다.
      - name: Show signing fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/upload-keystore.jks" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1|SHA256" || true

      # 성공/실패와 무관하게 서명 재료를 지운다.
      - name: Clean up signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      # Play 업로드보다 먼저 올려둔다. 업로드가 거절당하더라도 빌드 결과물은 남는다.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: light-on-flashlight-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # 출시 노트는 whatsnew-<로케일> 이라는 이름의 파일로 넘겨야 한다.
      # 노트를 비워두면 디렉터리 자체를 만들지 않고, 아래 업로드에서도 생략된다.
      - name: Prepare release notes
        id: whatsnew
        if: inputs.track != 'none' && inputs.release_notes != ''
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          LOCALE: ${{ inputs.release_notes_locale }}
        run: |
          dir="$RUNNER_TEMP/whatsnew"
          mkdir -p "$dir"
          printf '%s' "$RELEASE_NOTES" > "$dir/whatsnew-$LOCALE"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # 서드파티 액션이 서비스 계정 키를 다루므로, 태그(v1.1.5)가 아니라 커밋 SHA로 고정한다.
      # 태그는 옮겨질 수 있지만 SHA는 그럴 수 없다.
      - name: Upload to Play (${{ inputs.track }})
        if: inputs.track != 'none'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mycompany.lightonflashlight
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          # 단수형 track은 deprecated다. tracks는 비워두면 production으로 간주되지만,
          # 이 단계는 track이 none이 아닐 때만 도니 항상 값이 채워져 있다.
          tracks: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
          whatsNewDirectory: ${{ steps.whatsnew.outputs.dir }}
