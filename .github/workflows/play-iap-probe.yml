name: Probe Play in-app products

# 인앱 상품(결제)을 만들 준비가 됐는지 확인한다. 완전한 읽기 전용이다.
#
# 무엇을 알아내는가:
#   1. 서비스 계정에 인앱 상품 권한이 있는가
#      -> 필요한 권한은 "스토어 등록정보 관리(Manage store presence)"다.
#         "주문 및 정기 결제 관리"가 아니다 -- 그건 orders/purchases 용이다.
#   2. 이미 등록된 상품이 있다면 그 판매자 통화
#      -> 지역 가격을 적으려면 이 값이 필요하다.
#
# 왜 엔드포인트가 둘인가:
#   레거시 `inappproducts` 는 이 앱에서 403 으로 막혀 있다. 권한 문제가 아니라
#   본문이 그렇게 말한다 --
#       { "code": 403, "message": "Please migrate to the new publishing API.",
#         "status": "PERMISSION_DENIED" }
#   즉 이 계정은 신규 `monetization.onetimeproducts` API 를 써야 한다.
#   두 엔드포인트를 모두 때려서 어느 쪽이 살아 있는지 남긴다. 403 은
#   "권한 없음"과 "이 API 를 쓰지 마라"를 같은 코드로 돌려주므로,
#   본문을 읽지 않고 코드만 보면 진단이 틀린다.
#
# edits 트랜잭션을 쓰지 않는다:
#   inappproducts / onetimeproducts 모두 edits 밖의 독립 리소스다. 공식 문서 원문 --
#   "Methods for the inappproducts, products, and subscriptions resources
#    take effect immediately, whether or not there is an open edit."
#   그래서 play-status.yml 과 달리 edit 을 열 필요가 없고, 열지 않으므로
#   실수로 commit 될 여지도 없다. 여기에 POST /edits 를 추가하지 마라.
#
# 이 워크플로는 GET 만 호출한다. 쓰기 경로가 아예 없다.
#
# 필요한 GitHub Secret:
#   PLAY_SERVICE_ACCOUNT_JSON  다른 Play 워크플로가 쓰는 것과 같은 키

# GitHub 은 workflow_dispatch 를 "기본 브랜치에 있는 워크플로"만 디스패치한다.
# 이 파일은 아직 main 에 없어서 수동 실행이 404 로 막힌다. 프로브 하나를 돌리려고
# main 을 건드릴 이유는 없으므로, push 트리거로 이 브랜치에서 직접 돌린다.
# GET 만 하는 20초짜리라 매 푸시마다 돌아도 무해하다.
# 프로브가 답을 준 뒤에는 아래 push: 블록을 지운다.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/payment-feature-zzrlaz

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Play service account secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON 시크릿이 필요합니다."
            exit 1
          fi

      - name: Install Google auth library
        run: pip install --quiet google-auth requests

      - name: Probe in-app products (read-only)
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.mycompany.lightonflashlight
        run: |
          python3 <<'PY'
          import json, os
          import google.auth.transport.requests
          from google.oauth2 import service_account

          PKG = os.environ["PACKAGE_NAME"]
          BASE = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PKG}"

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          session = google.auth.transport.requests.AuthorizedSession(creds)

          def probe(label, url):
              print("=" * 64)
              print(f"{label}")
              print(f"GET {url}")
              print("=" * 64)
              r = session.get(url)
              print(f"HTTP {r.status_code}")
              # 판매자 프로필 미설정 / 권한 부족 / API 마이그레이션 요구를
              # 구분하는 유일한 단서가 본문이다. 가공하지 말고 원문을 남긴다.
              print(r.text)
              print()
              return r

          # 신규 API. 이 앱이 실제로 써야 하는 쪽이다.
          new = probe("신규: monetization.onetimeproducts.list", f"{BASE}/oneTimeProducts")

          # 레거시 API. 기록용으로 남긴다 -- 어느 쪽이 막혔는지가 진단이다.
          old = probe("레거시: inappproducts.list", f"{BASE}/inappproducts")

          print("=" * 64)
          print("판정")
          print("=" * 64)

          # 상품이 하나도 없으면 200 + 빈 객체가 아니라 204 No Content 가 온다.
          # 204 도 성공이므로 2xx 로 받아야 한다. 처음엔 200 만 봐서 오진했다.
          if 200 <= new.status_code < 300:
              body = new.json() if new.text.strip() else {}
              products = body.get("oneTimeProducts", [])
              print(f"신규 API 권한 OK. 등록된 일회성 상품 {len(products)}개")
              for p in products:
                  print(f"  productId={p.get('productId')}")
                  for lst in p.get("listings", []):
                      print(f"    listing {lst.get('languageCode')}: {lst.get('title')}")
                  for po in p.get("purchaseOptions", []):
                      print(f"    purchaseOption={po.get('purchaseOptionId')} "
                            f"state={po.get('state')} "
                            f"legacyCompatible={po.get('buyOption', {}).get('legacyCompatible')}")
                      for cfg in po.get("regionalPricingAndAvailabilityConfigs", []):
                          pr = cfg.get("price", {})
                          print(f"      {cfg.get('regionCode')}: "
                                f"{pr.get('units')}.{pr.get('nanos', 0):09d} {pr.get('currencyCode')} "
                                f"({cfg.get('availability')})")
              if not products:
                  print("아직 상품이 없다. 다음 단계: 상품 등록 워크플로를 돌린다.")
              print()
              print("regionsVersion 은 이 응답으로 알 수 없다. 등록 워크플로가")
              print("monetization.convertRegionPrices 응답의 regionVersion 을 그대로 쓴다.")
          elif new.status_code == 401:
              print("::error::401 - 서비스 계정 키 자체의 문제다.")
          elif new.status_code == 403:
              print("::error::403 - 위 본문을 읽어라.")
              print("'permission' 계열이면 Play Console -> 사용자 및 권한 -> 해당")
              print("서비스 계정에 '스토어 등록정보 관리(Manage store presence)' 권한을 준다.")
              print("(이 권한에 '가격, 인앱 상품, 가격 템플릿 수정'이 포함된다)")
          elif new.status_code == 400:
              print("::error::400 - 위 본문을 읽어라.")
              print("merchant / payments 가 언급되면 판매자(결제) 프로필 문제다.")
          else:
              print(f"::error::예상치 못한 상태 코드 {new.status_code}. 위 본문을 읽어라.")

          print()
          print(f"참고: 레거시 inappproducts 는 HTTP {old.status_code}")

          raise SystemExit(0 if 200 <= new.status_code < 300 else 1)
          PY
