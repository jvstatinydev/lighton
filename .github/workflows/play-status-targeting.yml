name: Probe generated APK targeting

# 조사용 임시 워크플로. Play Developer API의 generatedApks 응답에서
# targetingInfo(변형별 sdk/abi 타겟팅)만 뽑아 원문 그대로 찍는다.
# 응답 전체를 찍으면 split별 downloadId가 앞을 다 차지해 targetingInfo가 잘린다.
# 읽기 전용이며 edit을 만들지 않는다.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "조회할 버전 코드"
        required: true
        default: "13"

jobs:
  targeting:
    runs-on: ubuntu-latest
    steps:
      - name: Install Google auth library
        run: pip install --quiet google-auth requests

      - name: Dump targetingInfo
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ inputs.version_code }}
          PACKAGE_NAME: com.mycompany.lightonflashlight
        run: |
          python3 <<'PY'
          import json, os, sys
          import google.auth.transport.requests
          from google.oauth2 import service_account

          PKG = os.environ["PACKAGE_NAME"]
          VC = os.environ["VERSION_CODE"].strip()
          BASE = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PKG}"

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          session = google.auth.transport.requests.AuthorizedSession(creds)

          r = session.request("GET", f"{BASE}/generatedApks/{VC}")
          print(f"GET /generatedApks/{VC} -> HTTP {r.status_code}")
          if not r.ok:
              print(r.text[:2000])
              sys.exit(1)

          data = r.json()
          for i, entry in enumerate(data.get("generatedApks", [])):
              print(f"\n=== generatedApks[{i}] ===")
              print("최상위 키:", sorted(entry.keys()))
              print("split apk 개수:", len(entry.get("generatedSplitApks", [])))
              print("standalone apk 개수:", len(entry.get("generatedStandaloneApks", [])))
              print("universal apk:", "있음" if entry.get("generatedUniversalApk") else "없음")
              print("--- targetingInfo 원문 ---")
              print(json.dumps(entry.get("targetingInfo"), indent=2, ensure_ascii=False))
          PY
