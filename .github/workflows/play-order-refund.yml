name: Refund and revoke a Play order

# 주문 하나를 환불하고 권한을 회수한다. **돈이 오가는 쓰기 작업이다.**
#
# 왜 환불만으로는 안 되는가:
#   Play 에서 환불과 권한 취소는 별개다. 환불만 하면 사용자는 돈을 돌려받고도
#   상품을 계속 소유한 상태로 남는다. 그러면 queryPurchases 가 계속 "소유 중"
#   으로 답해서 재구매도 막히고, 앱에서 광고도 돌아오지 않는다.
#   그래서 revoke=true 를 함께 보낸다.
#
# 주문 ID 는 이 저장소에 커밋하지 않는다. 공개 저장소이고, 주문 ID 는
# 사용자의 결제 기록이다. 반드시 workflow_dispatch 입력으로만 받는다.
# (그래서 이 워크플로에는 push 트리거를 달지 않는다. 달면 ID 를 커밋해야 한다.)
#
# 주문 ID 찾는 곳:
#   - Play Console -> 주문 관리
#   - Google Play 결제 확인 메일의 "주문번호" (GPA.____-____-____-_____)
#
# 안전장치 (play-release-name.yml / play-track-clear.yml 과 같은 방식):
#   기본값 apply=false 는 주문 정보만 읽고 끝난다. 실제 환불은 apply=true 이고
#   confirm 이 주문 ID 를 그대로 반복할 때만 일어난다.
#
# 필요한 GitHub Secret:
#   PLAY_SERVICE_ACCOUNT_JSON
#   단, 이 API 는 "주문 및 정기 결제 관리" 권한을 요구한다. 상품 등록에 쓰는
#   "가격 및 인앱 상품 관리" 와 다른 권한이므로 없을 수 있다. 미리보기가
#   403 을 돌려주면 그 권한이 없는 것이다.

on:
  workflow_dispatch:
    inputs:
      order_id:
        description: "주문 ID (예: GPA.1234-5678-9012-34567)"
        required: true
      apply:
        description: "true 일 때만 실제로 환불한다. 기본은 조회만."
        required: false
        default: "false"
      confirm:
        description: "apply=true 이면 주문 ID 를 그대로 다시 입력해야 한다."
        required: false
        default: ""

jobs:
  refund:
    runs-on: ubuntu-latest
    steps:
      - name: Check Play service account secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON 시크릿이 필요합니다."
            exit 1
          fi

      - name: Install Google auth library
        run: pip install --quiet google-auth requests

      - name: Refund and revoke
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.mycompany.lightonflashlight
          ORDER_ID: ${{ github.event.inputs.order_id }}
          APPLY: ${{ github.event.inputs.apply }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          python3 <<'PY'
          import json, os
          import google.auth.transport.requests
          from google.oauth2 import service_account

          PKG = os.environ["PACKAGE_NAME"]
          ORDER_ID = os.environ["ORDER_ID"].strip()
          APPLY = os.environ["APPLY"].strip().lower() == "true"
          CONFIRM = os.environ["CONFIRM"].strip()

          if not ORDER_ID:
              print("::error::주문 ID 가 비어 있다.")
              raise SystemExit(1)

          BASE = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PKG}"

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          session = google.auth.transport.requests.AuthorizedSession(creds)

          # ---------------------------------------------------------------
          # 1. 주문 조회. 무엇을 건드리는지 먼저 보여준다.
          # ---------------------------------------------------------------
          print("=" * 64)
          print(f"주문 조회: {ORDER_ID}")
          print("=" * 64)

          got = session.get(f"{BASE}/orders/{ORDER_ID}")
          print(f"HTTP {got.status_code}")
          print(got.text or "(빈 본문)")
          print()

          if got.status_code == 403:
              print("::error::403 - 서비스 계정에 '주문 및 정기 결제 관리' 권한이 없다.")
              print("Play Console -> 사용자 및 권한 에서 부여하거나,")
              print("콘솔의 '주문 관리' 화면에서 직접 환불하면 된다.")
              raise SystemExit(1)
          if got.status_code == 404:
              print("::error::404 - 그런 주문이 없다. 주문 ID 를 다시 확인하라.")
              raise SystemExit(1)
          if got.status_code != 200:
              print(f"::error::예상치 못한 상태 코드 {got.status_code}.")
              raise SystemExit(1)

          # ---------------------------------------------------------------
          # 2. 게이트
          # ---------------------------------------------------------------
          if not APPLY:
              print("=" * 64)
              print("조회만 했다. 환불하지 않았다.")
              print(f"실제로 환불하려면 apply=true, confirm={ORDER_ID} 로 다시 돌려라.")
              print("=" * 64)
              raise SystemExit(0)

          if CONFIRM != ORDER_ID:
              print(f"::error::apply=true 인데 confirm 이 '{CONFIRM}' 이다. "
                    f"주문 ID 를 그대로 입력해야 한다.")
              raise SystemExit(1)

          # ---------------------------------------------------------------
          # 3. 환불 + 권한 회수
          # ---------------------------------------------------------------
          print("=" * 64)
          print("환불 + 권한 회수")
          print("=" * 64)

          # revoke=true 가 핵심이다. 빼면 돈만 돌려주고 소유는 그대로 남아서
          # 재구매도 막히고 앱에서 광고도 돌아오지 않는다.
          r = session.post(f"{BASE}/orders/{ORDER_ID}:refund", params={"revoke": "true"})
          print(f"HTTP {r.status_code}")
          print(r.text or "(빈 본문 - 성공 시 정상)")
          print()

          if r.status_code not in (200, 204):
              print(f"::error::환불 실패 ({r.status_code}). 위 본문을 읽어라.")
              raise SystemExit(1)

          print("=" * 64)
          print("완료")
          print("=" * 64)
          print("앱에서 광고가 바로 돌아오지는 않는다. 서로 다른 콜드 스타트에서")
          print("3회 연속 '확정 미소유'여야 권한을 회수하도록 만들어 두었기 때문이다")
          print("(lib/flutter_flow/billing_util.dart 의 _kRevokeAfterConsecutiveMisses).")
          print("앱을 세 번 껐다 켜면 광고가 돌아온다. 그 자체가 환불 회수 경로의 검증이다.")
          print("빠르게 초기화하려면 앱 데이터를 지우면 된다.")
          PY
